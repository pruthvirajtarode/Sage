<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SAGE AI - The exclusive business development and customer support assistant for YAS Shoe Care.">
    <title>SAGE AI Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/sage-widget.css?v=1.0.5">
    <script>
        // Immediate check to prevent button flicker in embedded mode
        if (window.self !== window.top) {
            document.documentElement.classList.add('is-embedded');
        }
    </script>
</head>

<body>
    <!-- Widget Button -->
    <button class="widget-button" id="widgetButton" onclick="openWidgetDirectly(); return false;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </button>

    <!-- Widget Container -->
    <div class="widget-container" id="widgetContainer">
        <div class="widget-header">
            <div class="widget-title">
                <svg class="widget-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" fill="url(#widgetGradient)" stroke="white" stroke-width="2" />
                    <path d="M12 7V17M7 12H17" stroke="white" stroke-width="2" stroke-linecap="round" />
                    <defs>
                        <linearGradient id="widgetGradient" x1="2" y1="2" x2="22" y2="12">
                            <stop offset="0%" stop-color="#14532d" />
                            <stop offset="100%" stop-color="#22c55e" />
                        </linearGradient>
                    </defs>
                </svg>
                <span>SAGE AI</span>
            </div>
            <button class="widget-close" id="widgetClose" onclick="closeWidgetDirectly(); return false;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M18 6L6 18M6 6l12 12" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>

        <div class="widget-messages" id="widgetMessages">
            <div class="widget-welcome">
                <div class="widget-avatar">
                    <img src="images/sage_avatar.png" alt="SAGE AI" class="widget-avatar-image" />
                </div>
                <div class="widget-welcome-text">
                    <h3>Hi! I'm SAGE AI</h3>
                    <p>Your Business Assistant. How can I help you today?</p>
                </div>
            </div>
        </div>

        <div class="widget-action-bar">
            <a href="https://line.me/R/ti/p/@184oitug" target="_blank" rel="noopener noreferrer" class="line-connect-btn">
                <svg class="line-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor" width="16" height="16">
                    <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.105.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                </svg>
                <span>Connect on LINE</span>
            </a>
        </div>

        <div class="widget-input">
            <input type="text" id="widgetInput" class="widget-input-field" placeholder="Ask me anything..." />
            <button class="widget-send" id="widgetSend">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
        </div>

        <div class="widget-footer">
            Powered by <strong>SAGE AI</strong>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/sage-widget.js?v=1.3.5"></script>
</body>

</html>
